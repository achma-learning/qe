name: Release Android APK

# Publishes a GitHub Release with the prebuilt debug APK
# (android/dist/qe-bank-debug.apk) attached, so it's easy to find and
# download without digging through the repo tree.
#
# Manual only: run from the Actions tab ("Run workflow"), optionally
# overriding the tag. Leave the tag blank to auto-generate a timestamped one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank = auto-generate android-vYYYYMMDD-HHMMSS)'
        required: false
        default: ''
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then TAG="android-v$(date -u +%Y%m%d-%H%M%S)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify APK exists
        run: test -f android/dist/qe-bank-debug.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "QE Android app — ${{ steps.vars.outputs.tag }}"
          body: |
            Prebuilt **debug** APK of the QE — MCQ Bank Android app: a thin
            WebView wrapper around the site itself (see `android/README.md`).

            - Package: `online.qe.mcqbank`
            - minSdk 23 (Android 6.0) · targetSdk 34
            - No network permission — fully offline
            - Self-signed with Gradle's default debug key: fine to sideload
              for personal use, not suitable for Play Store distribution as-is

            Install: enable "install unknown apps" for the app you use to open
            the file, then open the APK.
          files: android/dist/qe-bank-debug.apk
