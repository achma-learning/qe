plugins {
    id("com.android.application")
}

android {
    namespace "online.qe.mcqbank"
    compileSdk 34

    defaultConfig {
        applicationId "online.qe.mcqbank"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // One fixed key for every build, committed on purpose (owner's choice):
    // Android only lets an APK update an installed app signed with the same
    // key. Before 1.3 each build used the building machine's throwaway debug
    // key, so a new APK refused to install over the old one (uninstall = lost
    // progress). Sideload-only personal app, not a Play Store identity.
    signingConfigs {
        debug {
            storeFile rootProject.file("qe-debug.keystore")
            storePassword "qebank-debug"
            keyAlias "qe-debug"
            keyPassword "qebank-debug"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // appcompat pulls in both the merged kotlin-stdlib (1.8+) and the older,
    // now-redundant kotlin-stdlib-jdk7/jdk8 artifacts transitively, which
    // duplicate classes and fail the build. Those artifacts' contents live
    // in kotlin-stdlib itself since Kotlin 1.8, so dropping them is safe.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    // Only pulled in for AppCompatActivity + the modern OnBackPressedCallback
    // API. The app itself makes no network calls and has no other runtime
    // dependency — the whole experience is the offline HTML/CSS/JS asset.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
